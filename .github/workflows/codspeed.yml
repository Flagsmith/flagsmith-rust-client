name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # Check out the repository and its submodules
  id-token: write  # Authenticate result uploads to CodSpeed via OIDC

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ${{ vars.CODSPEED_RUNS_ON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3  # v1.3.0
        with:
          channel: stable
          cache-target: release

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062  # v5.6.0
        with:
          mode: ${{ vars.CODSPEED_MODE }}
          run: make benchmark
