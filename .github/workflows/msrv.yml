name: MSRV

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install MSRV toolchain
      run: rustup toolchain install 1.86.0 --profile minimal
    - name: Check with MSRV
      run: cargo +1.86.0 check --verbose
