# The steps file as a crate, built by the Rust harness of the Flagsmith SDK behavioural spec.
[package]
name = "sdk-spec"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "steps.rs"

[dependencies]
flagsmith = { path = ".." }
flagsmith-flag-engine = { git = "https://github.com/Flagsmith/flagsmith-rust-flag-engine", rev = "c261f544cb7b19e8373cde8297e9a885415dcc69" }
serde = { version = "1.0", features = ["derive"] }
