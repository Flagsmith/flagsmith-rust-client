# The steps file as a crate, built by the Rust harness of the Flagsmith SDK behavioural spec.
[package]
name = "sdk-spec"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "steps.rs"

[dependencies]
flagsmith = { path = ".." }
flagsmith-flag-engine = { git = "https://github.com/Flagsmith/flagsmith-rust-flag-engine", rev = "0552139222db80ea1ec16ec5a6a7e4ae5912bcc5" }
serde = { version = "1.0", features = ["derive"] }
